# ===========================================================================
#  CONFIGURATION AND SECRETS
#
#  The rule: no service ever has a hostname, a username or a password
#  written inside its source code. Everything arrives as an environment
#  variable at start-up.
#
#  Why that matters:
#    * the SAME container image runs in development, test and production -
#      only the configuration changes. That is the "Twelve-Factor App"
#      principle of strict config/code separation.
#    * a password that is not in the source code cannot be leaked by
#      pushing the source code to a public GitHub repository.
# ===========================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: medimatrx-config
  namespace: medimatrx
data:
  # ---- Where each service can find the others -----------------------------
  # These are Kubernetes DNS names, not IP addresses. "mongodb" resolves to
  # whichever pod is currently running the database; if that pod is replaced,
  # the name still works. This is Service Discovery.
  MONGO_HOST: "mongodb:27017"
  MONGO_DB: "medimatrx"
  INGEST_URL: "http://ingest-service:8080"
  PRICE_URL: "http://price-service:8080"
  OPTIMIZER_URL: "http://optimizer-service:8080"

  # ---- Behaviour ----------------------------------------------------------
  PRICE_AREA: "SE4"           # Swedish electricity bidding area (SE4 = south)
  CACHE_TTL_SECONDS: "900"    # how long the price service caches a result
  UPSTREAM_TIMEOUT: "6.0"
  UPSTREAM_TIMEOUT_MS: "8000"
  RATE_LIMIT: "600"           # gateway: max API requests per IP per minute
  TZ: "Europe/Stockholm"

---
# ===========================================================================
#  THE DATABASE PASSWORD
#
#  IMPORTANT, and say this in the video: a Kubernetes Secret is only
#  base64-ENCODED, not encrypted. Anyone who can read Secrets in this
#  namespace can read the password. It is better than hard-coding it in the
#  source, but it is NOT production-grade secret management.
#
#  For production you would use one of:
#    * Kubernetes Secrets with encryption-at-rest enabled on etcd
#    * an external vault (HashiCorp Vault, AWS Secrets Manager,
#      Azure Key Vault) pulled in by the Secrets Store CSI driver
#    * short-lived, automatically rotated database credentials
#
#  This limitation is discussed in the security section of the report.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: medimatrx-db-credentials
  namespace: medimatrx
type: Opaque
stringData:
  # stringData lets us write the value in plain text here; Kubernetes
  # base64-encodes it for us when the object is created.
  MONGO_USER: "medimatrx"
  MONGO_PASSWORD: "ChangeMeBeforeProduction_2026"
