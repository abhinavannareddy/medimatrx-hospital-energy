# ===========================================================================
#  API GATEWAY - the only part of MediWatt reachable from outside
#
#  This is what satisfies "the application must be accessible from the
#  outside of Kubernetes (e.g. via a web browser)".
#
#  The Service below is type NodePort, which means Kubernetes opens a port
#  on the cluster node itself. On Docker Desktop the node IS your laptop,
#  so the dashboard appears at:
#
#         http://localhost:30080
#
#  On a real cloud provider you would use type LoadBalancer (which gives you
#  a public IP) or an Ingress with a TLS certificate. There is a ready-made
#  Ingress at the bottom of this file, commented out.
# ===========================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: mediwatt
  labels:
    app: gateway
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: mediwatt
  labels:
    app: gateway
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: gateway
                topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          image: abhinavannareddy/mediwatt-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: mediwatt-config
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # The root filesystem is read-only, so give the process one small
          # scratch area for temporary files.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}

# ===========================================================================
#  OPTIONAL: Ingress instead of NodePort.
#
#  An Ingress is the production way in: one HTTP entry point for the whole
#  cluster, with a hostname and a TLS certificate. It needs an ingress
#  controller installed first, for example:
#
#    kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#
#  Then uncomment everything below and browse to http://mediwatt.localdev.me
# ---------------------------------------------------------------------------
