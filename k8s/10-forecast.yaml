# ===========================================================================
#  FORECAST SERVICE - the one that talks about tomorrow
#
#  Every other service in this platform describes what already happened.
#  This one predicts tomorrow's load from the weather forecast, fetches
#  tomorrow's day-ahead prices, and asks the optimizer to plan against them.
#
#  Note it does NOT contain a copy of the optimisation algorithm. It posts
#  the predicted load to the optimizer's scenario endpoint, so today's report
#  and tomorrow's plan come out of the same engine and cannot drift apart.
#
#  Like the price service, this one needs the public internet (Open-Meteo),
#  which is why it gets its own egress rule in the network policy. It is the
#  second and last pod in the system allowed out.
# ===========================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: forecast-service
  namespace: medimatrx
  labels:
    app: forecast
spec:
  type: ClusterIP
  selector:
    app: forecast
  ports:
    - name: http
      port: 8080
      targetPort: http

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast
  namespace: medimatrx
  labels:
    app: forecast
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: forecast
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: forecast
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: forecast
                topologyKey: kubernetes.io/hostname
      containers:
        - name: forecast
          image: abhinavannareddy/medimatrx-forecast:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: medimatrx-config
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
