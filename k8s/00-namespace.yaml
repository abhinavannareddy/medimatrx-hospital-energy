# ===========================================================================
#  A namespace is a labelled box inside the Kubernetes cluster.
#  Everything MediMatrx owns goes in this box, which means:
#    * "kubectl delete namespace medimatrx" cleans up the whole application
#    * we can apply network and security rules to the box as a whole
#    * MediMatrx cannot accidentally collide with anything else in the cluster
# ===========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: medimatrx
  labels:
    name: medimatrx
    app.kubernetes.io/part-of: medimatrx
