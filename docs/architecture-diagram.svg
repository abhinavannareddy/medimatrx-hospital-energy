<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
    </marker>
  </defs>

  <rect width="940" height="700" fill="#ffffff"/>

  <!-- ================= Kubernetes cluster boundary ================= -->
  <rect x="18" y="112" width="700" height="512" rx="12" fill="#f7f9fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="34" y="136" font-size="12.5" font-weight="700" fill="#2a78d6" letter-spacing="0.08em">KUBERNETES CLUSTER · namespace: medimatrx</text>

  <!-- ================= Browser (outside) ================= -->
  <rect x="228" y="20" width="280" height="56" rx="9" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="368" y="44" text-anchor="middle" font-size="14" font-weight="650" fill="#0b0b0b">Hospital estates manager</text>
  <text x="368" y="63" text-anchor="middle" font-size="12" fill="#52514e">web browser</text>

  <!-- browser -> gateway -->
  <line x1="368" y1="76" x2="368" y2="164" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="378" y="106" width="176" height="20" rx="4" fill="#ffffff"/>
  <text x="384" y="121" font-size="11.5" fill="#52514e">HTTP :30080 (NodePort)</text>

  <!-- ================= Gateway ================= -->
  <rect x="188" y="166" width="360" height="74" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <rect x="188" y="166" width="6" height="74" rx="3" fill="#2a78d6"/>
  <text x="208" y="192" font-size="14.5" font-weight="700" fill="#0b0b0b">API GATEWAY</text>
  <text x="208" y="211" font-size="12" fill="#52514e">Node.js / Express · 2-10 replicas</text>
  <text x="208" y="229" font-size="11.5" fill="#898781">dashboard · routing · rate limit · security headers</text>
  <text x="533" y="192" text-anchor="end" font-size="11" font-weight="700" fill="#2a78d6">C1</text>

  <!-- gateway -> three services -->
  <path d="M 250 240 L 250 268 L 118 268 L 118 300" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 368 240 L 368 300" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 486 240 L 486 268 L 618 268 L 618 300" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= Ingest ================= -->
  <rect x="34" y="302" width="168" height="96" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
  <rect x="34" y="302" width="6" height="96" rx="3" fill="#2a78d6"/>
  <text x="52" y="326" font-size="13" font-weight="700" fill="#0b0b0b">INGEST</text>
  <text x="52" y="344" font-size="11.5" fill="#52514e">Node.js / Express</text>
  <text x="52" y="361" font-size="11.5" fill="#52514e">2-12 replicas</text>
  <text x="52" y="382" font-size="11" font-weight="650" fill="#2a78d6">owns the database</text>
  <text x="188" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#2a78d6">C2</text>

  <!-- ================= Optimizer (middle) ================= -->
  <rect x="272" y="302" width="192" height="96" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/>
  <rect x="272" y="302" width="6" height="96" rx="3" fill="#eb6834"/>
  <text x="290" y="326" font-size="13" font-weight="700" fill="#0b0b0b">OPTIMIZER</text>
  <text x="290" y="344" font-size="11.5" fill="#52514e">Python / FastAPI</text>
  <text x="290" y="361" font-size="11.5" fill="#52514e">2-15 replicas</text>
  <text x="290" y="382" font-size="11" font-weight="650" fill="#eb6834">stateless, no database</text>
  <text x="450" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#eb6834">C4</text>

  <!-- ================= Price ================= -->
  <rect x="534" y="302" width="168" height="96" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/>
  <rect x="534" y="302" width="6" height="96" rx="3" fill="#1baf7a"/>
  <text x="552" y="326" font-size="13" font-weight="700" fill="#0b0b0b">PRICE</text>
  <text x="552" y="344" font-size="11.5" fill="#52514e">Python / FastAPI</text>
  <text x="552" y="361" font-size="11.5" fill="#52514e">2-4 replicas</text>
  <text x="552" y="382" font-size="11" font-weight="650" fill="#1baf7a">15-min cache + fallback</text>
  <text x="688" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#1baf7a">C3</text>

  <!-- optimizer -> ingest (one continuous dashed path, down and around) -->
  <path d="M 300 398 L 300 432 L 226 432 L 226 374 L 204 374" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>

  <!-- optimizer -> price (one continuous dashed path) -->
  <path d="M 436 398 L 436 432 L 510 432 L 510 374 L 532 374" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>

  <rect x="292" y="440" width="182" height="19" rx="4" fill="#f7f9fc"/>
  <text x="296" y="454" font-size="11" fill="#898781">optimizer calls both, concurrently</text>

  <!-- ================= MongoDB ================= -->
  <rect x="34" y="478" width="220" height="128" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/>
  <rect x="34" y="478" width="6" height="128" rx="3" fill="#52514e"/>
  <text x="52" y="502" font-size="13" font-weight="700" fill="#0b0b0b">MONGODB</text>
  <text x="52" y="520" font-size="11.5" fill="#52514e">StatefulSet · 1 replica</text>
  <text x="240" y="502" text-anchor="end" font-size="11" font-weight="700" fill="#52514e">C5</text>

  <rect x="52" y="532" width="184" height="56" rx="7" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.2"/>
  <text x="144" y="553" text-anchor="middle" font-size="11.5" font-weight="650" fill="#0b0b0b">PersistentVolumeClaim</text>
  <text x="144" y="571" text-anchor="middle" font-size="11" fill="#52514e">2 GiB, survives pod deletion</text>

  <!-- ingest -> mongo -->
  <line x1="118" y1="398" x2="118" y2="476" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="126" y="424" width="120" height="19" rx="4" fill="#f7f9fc"/>
  <text x="130" y="438" font-size="11" fill="#52514e">mongodb :27017</text>

  <!-- ================= External API ================= -->
  <rect x="756" y="302" width="168" height="96" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="840" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">elprisetjustnu.se</text>
  <text x="840" y="350" text-anchor="middle" font-size="11.5" fill="#52514e">public REST API</text>
  <text x="840" y="368" text-anchor="middle" font-size="11.5" fill="#52514e">Swedish spot prices</text>
  <text x="840" y="387" text-anchor="middle" font-size="11" fill="#898781">outside the cluster</text>

  <!-- price -> external -->
  <line x1="704" y1="350" x2="752" y2="350" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="728" y="342" text-anchor="middle" font-size="10.5" font-weight="650" fill="#1baf7a">HTTPS</text>

  <!-- ================= Legend ================= -->
  <line x1="34" y1="654" x2="906" y2="654" stroke="#e1e0d9" stroke-width="1"/>
  <text x="34" y="676" font-size="11" fill="#898781">Solid arrows = request path · Dashed = internal service-to-service REST calls · Only the gateway is reachable from outside the cluster</text>

  <!-- external label -->
  <text x="906" y="136" text-anchor="end" font-size="12.5" font-weight="700" fill="#898781" letter-spacing="0.08em">EXTERNAL</text>
</svg>
