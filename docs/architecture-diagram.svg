<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52514e"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#898781"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1baf7a"/>
    </marker>
    <marker id="arrowteal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e9aa7"/>
    </marker>
  </defs>

  <rect width="1000" height="830" fill="#ffffff"/>

  <!-- ================= Kubernetes cluster boundary ================= -->
  <rect x="18" y="112" width="940" height="528" rx="12" fill="#f7f9fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="34" y="136" font-size="12.5" font-weight="700" fill="#2a78d6" letter-spacing="0.08em">KUBERNETES CLUSTER · namespace: medimatrx</text>

  <!-- ================= Browser (outside) ================= -->
  <rect x="348" y="20" width="280" height="56" rx="9" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="488" y="44" text-anchor="middle" font-size="14" font-weight="650" fill="#0b0b0b">Hospital estates manager</text>
  <text x="488" y="63" text-anchor="middle" font-size="12" fill="#52514e">web browser</text>

  <!-- browser -> gateway -->
  <line x1="488" y1="76" x2="488" y2="164" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="498" y="106" width="176" height="20" rx="4" fill="#ffffff"/>
  <text x="504" y="121" font-size="11.5" fill="#52514e">HTTP :30080 (NodePort)</text>

  <!-- ================= Gateway ================= -->
  <rect x="308" y="166" width="360" height="74" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
  <rect x="308" y="166" width="6" height="74" rx="3" fill="#2a78d6"/>
  <text x="328" y="192" font-size="14.5" font-weight="700" fill="#0b0b0b">API GATEWAY</text>
  <text x="328" y="211" font-size="12" fill="#52514e">Node.js / Express · 2-10 replicas</text>
  <text x="328" y="229" font-size="11.5" fill="#898781">dashboard · routing · rate limit · security headers</text>
  <text x="653" y="192" text-anchor="end" font-size="11" font-weight="700" fill="#2a78d6">C1</text>

  <!-- gateway -> distribution bus -> five services -->
  <line x1="488" y1="240" x2="488" y2="272" stroke="#52514e" stroke-width="1.6"/>
  <line x1="128" y1="272" x2="848" y2="272" stroke="#52514e" stroke-width="1.6"/>
  <line x1="128" y1="272" x2="128" y2="300" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="308" y1="272" x2="308" y2="300" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="488" y1="272" x2="488" y2="300" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="668" y1="272" x2="668" y2="300" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="848" y1="272" x2="848" y2="300" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= C2 Ingest ================= -->
  <rect x="48" y="302" width="160" height="110" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/>
  <rect x="48" y="302" width="6" height="110" rx="3" fill="#2a78d6"/>
  <text x="66" y="326" font-size="13" font-weight="700" fill="#0b0b0b">INGEST</text>
  <text x="66" y="345" font-size="11.5" fill="#52514e">Node.js / Express</text>
  <text x="66" y="362" font-size="11.5" fill="#52514e">2-12 replicas</text>
  <text x="66" y="383" font-size="11" font-weight="650" fill="#2a78d6">owns the database</text>
  <text x="66" y="399" font-size="10" fill="#898781">meter readings + summaries</text>
  <text x="194" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#2a78d6">C2</text>

  <!-- ================= C3 Price ================= -->
  <rect x="228" y="302" width="160" height="110" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/>
  <rect x="228" y="302" width="6" height="110" rx="3" fill="#1baf7a"/>
  <text x="246" y="326" font-size="13" font-weight="700" fill="#0b0b0b">PRICE</text>
  <text x="246" y="345" font-size="11.5" fill="#52514e">Python / FastAPI</text>
  <text x="246" y="362" font-size="11.5" fill="#52514e">2-4 replicas</text>
  <text x="246" y="383" font-size="11" font-weight="650" fill="#1baf7a">15-min cache</text>
  <text x="246" y="399" font-size="10" fill="#898781">SE1-SE4, plus fallback</text>
  <text x="374" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#1baf7a">C3</text>

  <!-- ================= C4 Optimizer ================= -->
  <rect x="408" y="302" width="160" height="110" rx="10" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"/>
  <rect x="408" y="302" width="6" height="110" rx="3" fill="#eb6834"/>
  <text x="426" y="326" font-size="13" font-weight="700" fill="#0b0b0b">OPTIMIZER</text>
  <text x="426" y="345" font-size="11.5" fill="#52514e">Python / FastAPI</text>
  <text x="426" y="362" font-size="11.5" fill="#52514e">2-15 replicas</text>
  <text x="426" y="383" font-size="11" font-weight="650" fill="#eb6834">owns the algorithm</text>
  <text x="426" y="399" font-size="10" fill="#898781">stateless, no database</text>
  <text x="554" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#eb6834">C4</text>

  <!-- ================= C5 Assistant ================= -->
  <rect x="588" y="302" width="160" height="110" rx="10" fill="#ffffff" stroke="#7a5af0" stroke-width="1.8"/>
  <rect x="588" y="302" width="6" height="110" rx="3" fill="#7a5af0"/>
  <text x="606" y="326" font-size="13" font-weight="700" fill="#0b0b0b">ASSISTANT</text>
  <text x="606" y="345" font-size="11.5" fill="#52514e">Python / FastAPI</text>
  <text x="606" y="362" font-size="11.5" fill="#52514e">2-10 replicas</text>
  <text x="606" y="383" font-size="11" font-weight="650" fill="#7a5af0">read-only by design</text>
  <text x="606" y="399" font-size="10" fill="#898781">reads C2, C3, C4</text>
  <text x="734" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#7a5af0">C5</text>

  <!-- ================= C6 Forecast ================= -->
  <rect x="768" y="302" width="160" height="110" rx="10" fill="#ffffff" stroke="#0e9aa7" stroke-width="1.8"/>
  <rect x="768" y="302" width="6" height="110" rx="3" fill="#0e9aa7"/>
  <text x="786" y="326" font-size="13" font-weight="700" fill="#0b0b0b">FORECAST</text>
  <text x="786" y="345" font-size="11.5" fill="#52514e">Python / FastAPI</text>
  <text x="786" y="362" font-size="11.5" fill="#52514e">2-4 replicas</text>
  <text x="786" y="383" font-size="11" font-weight="650" fill="#0e9aa7">plans tomorrow</text>
  <text x="786" y="399" font-size="10" fill="#898781">reads C3, posts to C4</text>
  <text x="914" y="326" text-anchor="end" font-size="11" font-weight="700" fill="#0e9aa7">C6</text>

  <!-- ============ internal service-to-service REST calls (dashed) ============ -->
  <!-- optimizer -> price (adjacent) -->
  <line x1="406" y1="352" x2="392" y2="352" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>
  <!-- assistant -> optimizer (adjacent) -->
  <line x1="586" y1="352" x2="572" y2="352" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>
  <!-- optimizer -> ingest (routed under price) -->
  <path d="M 440 412 L 440 436 L 180 436 L 180 414" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>
  <!-- forecast -> optimizer (routed under assistant) -->
  <path d="M 848 412 L 848 428 L 528 428 L 528 414" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowlight)"/>
  <rect x="452" y="446" width="230" height="19" rx="4" fill="#f7f9fc"/>
  <text x="456" y="460" font-size="11" fill="#898781">internal REST, over Kubernetes DNS</text>

  <!-- ================= C7 MongoDB ================= -->
  <rect x="38" y="470" width="170" height="140" rx="10" fill="#ffffff" stroke="#52514e" stroke-width="1.8"/>
  <rect x="38" y="470" width="6" height="140" rx="3" fill="#52514e"/>
  <text x="56" y="494" font-size="13" font-weight="700" fill="#0b0b0b">MONGODB</text>
  <text x="56" y="512" font-size="11.5" fill="#52514e">StatefulSet · 1 replica</text>
  <text x="194" y="494" text-anchor="end" font-size="11" font-weight="700" fill="#52514e">C7</text>

  <rect x="56" y="528" width="134" height="62" rx="7" fill="#f0efec" stroke="#c3c2b7" stroke-width="1.2"/>
  <text x="123" y="549" text-anchor="middle" font-size="11" font-weight="650" fill="#0b0b0b">PersistentVolumeClaim</text>
  <text x="123" y="566" text-anchor="middle" font-size="10.5" fill="#52514e">2 GiB, survives</text>
  <text x="123" y="580" text-anchor="middle" font-size="10.5" fill="#52514e">pod deletion</text>

  <!-- ingest -> mongo -->
  <line x1="100" y1="412" x2="100" y2="468" stroke="#52514e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="108" y="450" width="112" height="19" rx="4" fill="#f7f9fc"/>
  <text x="112" y="464" font-size="11" fill="#52514e">mongodb :27017</text>

  <!-- ================= External band ================= -->
  <text x="34" y="670" font-size="12.5" font-weight="700" fill="#898781" letter-spacing="0.08em">EXTERNAL · outside the cluster</text>

  <rect x="228" y="678" width="180" height="90" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="318" y="704" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">elprisetjustnu.se</text>
  <text x="318" y="723" text-anchor="middle" font-size="11.5" fill="#52514e">Swedish spot prices</text>
  <text x="318" y="741" text-anchor="middle" font-size="11.5" fill="#52514e">public REST API</text>
  <text x="318" y="758" text-anchor="middle" font-size="10.5" fill="#898781">no key required</text>

  <rect x="768" y="678" width="180" height="90" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/>
  <text x="858" y="704" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0b0b0b">Open-Meteo</text>
  <text x="858" y="723" text-anchor="middle" font-size="11.5" fill="#52514e">weather forecast</text>
  <text x="858" y="741" text-anchor="middle" font-size="11.5" fill="#52514e">public REST API</text>
  <text x="858" y="758" text-anchor="middle" font-size="10.5" fill="#898781">no key required</text>

  <!-- price -> elprisetjustnu -->
  <line x1="308" y1="412" x2="308" y2="676" stroke="#1baf7a" stroke-width="1.8" marker-end="url(#arrowgreen)"/>
  <rect x="316" y="600" width="58" height="19" rx="4" fill="#f7f9fc"/>
  <text x="320" y="614" font-size="10.5" font-weight="650" fill="#1baf7a">HTTPS</text>

  <!-- forecast -> open-meteo -->
  <line x1="848" y1="412" x2="848" y2="676" stroke="#0e9aa7" stroke-width="1.8" marker-end="url(#arrowteal)"/>
  <rect x="856" y="600" width="58" height="19" rx="4" fill="#ffffff"/>
  <text x="860" y="614" font-size="10.5" font-weight="650" fill="#0e9aa7">HTTPS</text>

  <!-- ================= Legend ================= -->
  <line x1="34" y1="790" x2="966" y2="790" stroke="#e1e0d9" stroke-width="1"/>
  <text x="34" y="810" font-size="11" fill="#898781">Solid = request path · Dashed = internal service-to-service REST calls · Only C1 is reachable from outside the cluster · Only C3 and C6 may reach the internet</text>
</svg>
